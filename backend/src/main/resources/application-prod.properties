# ====================================================
# OPR Multas App - Perfil de Produção
# Ativar com: SPRING_PROFILES_ACTIVE=prod
# ====================================================

# ── PostgreSQL (Vercel Postgres / Neon / etc.) ────────
# Configure DATABASE_URL como uma URL JDBC, ex.:
#   jdbc:postgresql://host:5432/dbname?sslmode=require
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/multasdb}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Em produção não se criam dados de demonstração nem usuários padrão
opr.seed-demo-data=false

# ── Thymeleaf ────────────────────────────────────────
spring.thymeleaf.cache=true
