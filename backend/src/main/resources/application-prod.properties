# ====================================================
# OPR Multas App - Perfil de Produção
# Ativar com: SPRING_PROFILES_ACTIVE=prod
# ====================================================

# ── PostgreSQL (Supabase / Neon / RDS) ────────────────
# DATABASE_URL aceita o formato nativo do Supabase, ex.:
#   postgresql://postgres:SUA_SENHA@db.xxxx.supabase.co:5432/postgres
# ou o formato JDBC:
#   jdbc:postgresql://host:5432/postgres?sslmode=require
# URLs "postgresql://" sao convertidas automaticamente (DatasourceConfig).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/multasdb}
# Se DATABASE_URL ja tiver credenciais, DATABASE_USER/DATABASE_PASSWORD sao opcionais.
spring.datasource.username=${DATABASE_USER:}
spring.datasource.password=${DATABASE_PASSWORD:}

# Nao falha o startup por indisponibilidade momentanea do banco
spring.datasource.hikari.initialization-fail-timeout=-1

# Seed idempotente (admin/user/revisor) para o primeiro acesso ao banco.
# Para desativar em producao, defina a env OPR_SEED_DEMO_DATA=false.
# opr.seed-demo-data=true (padrao)

# ── Thymeleaf ────────────────────────────────────────
spring.thymeleaf.cache=true
