# ── Produção (Vercel + Supabase) ──────────────────────
# O schema é criado/atualizado pelo Liquibase no boot (db.changelog-master.yaml).
# O Hibernate não gerencia DDL (ddl-auto=none). Para forçar um reset do schema,
# derrube e recrie o banco (ex.: novo banco no Supabase) em vez de usar ddl-auto.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# ── Sessão persistente (Vercel + scale-to-zero) ─────────
# O container do Vercel escala a zero entre requests; a sessão em memória se perde,
# forçando login repetido. Aqui a sessão fica no Postgres (Spring Session JDBC) e
# sobrevive ao scale-to-zero. As tabelas SPRING_SESSION* já foram criadas uma vez no
# banco; initialize-schema=never evita re-rodar o DDL a cada cold-start (economiza
# round-trip no boot, deixa mais folga ao limite de 15s da Vercel).
spring.session.store-type=jdbc
spring.session.timeout=30m
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.schema=classpath:db/session-schema-postgres.sql

# Liquibase desligado em produção: rodá-lo no boot faz round-trips síncronos ao
# Postgres (Supabase) que inflaram o cold-start de ~9s para 13-16s, estourando o
# timeout fixo de 15s da Vercel para bind da porta (500 INTERNAL_FUNCTION_INVOCATION_FAILED).
# O schema do Supabase JÁ está migrado (5 changesets aplicados). Schema é "up to date".
# Para rodar uma nova migração manualmente: liquibase update ou habilite esta flag numa vez.
spring.liquibase.enabled=false

# Não criar dados de demonstração em produção (evita usuários/multas fake).
# Defina OPR_SEED_DEMO_DATA=true apenas se realmente quiser popular o ambiente.
opr.seed-demo-data=${OPR_SEED_DEMO_DATA:false}
