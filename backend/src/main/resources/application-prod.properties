# ── Produção (Vercel + Supabase) ──────────────────────
# O schema já existe no Supabase (criado pelo próprio app no primeiro boot com
# ddl-auto=update). Evitar o DDL/metadata por boot mantém o cold-start abaixo do
# limite de 15s da Vercel. Para (re)criar o schema, defina a env OPR_DDL_AUTO=update
# na Vercel, faça um deploy e depois volte para none.
spring.jpa.hibernate.ddl-auto=${OPR_DDL_AUTO:none}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
