<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Navbar compartilhada (parâmetro activePage: 'multas' | 'revisao' | 'score' | 'admin') -->
<nav class="navbar" th:fragment="navbar(activePage)">
    <div class="navbar-left">
        <a th:href="@{/multas}" class="navbar-brand">
            🚦 OPR Multas
            <span class="badge">Sistema</span>
        </a>
        <div class="navbar-links">
            <a th:href="@{/multas}" class="nav-link" th:classappend="${activePage == 'multas'} ? 'active'">Multas</a>
            <a th:href="@{/revisao}" class="nav-link" th:classappend="${activePage == 'revisao'} ? 'active'"
               sec:authorize="hasRole('ADMIN') or @moderacaoAccess.isRevisor()">Revisão</a>
            <a th:href="@{/meu-score}" class="nav-link" th:classappend="${activePage == 'score'} ? 'active'">Meu Score</a>
            <a th:href="@{/admin/moderacao}" class="nav-link" th:classappend="${activePage == 'admin'} ? 'active'"
               sec:authorize="hasRole('ADMIN')">Admin</a>
        </div>
    </div>
    <div class="navbar-user">
        <span class="score-badge" th:if="${currentUser != null}" th:text="'⭐ ' + ${currentUser.score}">⭐ 0</span>
        <span>Olá, <strong sec:authentication="name">Usuário</strong></span>
        <form th:action="@{/logout}" method="post" style="margin:0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-logout">Sair</button>
        </form>
    </div>
</nav>

<!-- Hipermídia (HATEOAS): renderiza os links de recurso expostos pelos controllers -->
<div class="card" th:fragment="hyperlinks(links)" th:if="${links != null}">
    <div class="card-header">
        <h2>Hipermídia (HATEOAS)</h2>
    </div>
    <div class="card-body">
        <div class="empty-state" th:if="${#lists.isEmpty(links)}" style="padding:8px">
            <p>Sem hiperlinks.</p>
        </div>
        <ul class="hateoas-links" th:unless="${#lists.isEmpty(links)}">
            <li th:each="link : ${links}">
                <span class="rel" th:text="${link.rel}">self</span>
                → <a th:href="${link.href}" th:text="${link.href}">/link</a>
            </li>
        </ul>
    </div>
</div>

</body>
</html>
