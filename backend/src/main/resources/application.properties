# ====================================================
# OPR Multas App - Configurações
# ====================================================

# Server
# Em plataformas como a Vercel, a porta é fornecida pela variável PORT
server.port=${PORT:8080}
spring.application.name=opr-multas-app

# ── Database ──────────────────────────────────────────
# Local (dev): H2 em memória.
# Produção (Vercel/Supabase): defina as envs abaixo (NUNCA no repositório):
#   DATABASE_URL      -> postgresql://usuario:senha@host:5432/banco  (convertida para JDBC
#                        automaticamente pelo DatasourceConfig) ou jdbc:postgresql://...
#                        Se estiver ausente ou for só o host (sem esquema), o DatasourceConfig
#                        usa POSTGRES_URL / POSTGRES_URL_NON_POOLING / POSTGRES_PRISMA_URL
#                        (integração Vercel x Supabase) ou monta a JDBC a partir do host.
#   DATABASE_USER     -> opcional se a URL já tiver credenciais
#   DATABASE_PASSWORD -> opcional se a URL já tiver credenciais
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:multasdb}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# Não derruba o startup se o banco estiver indisponível (lazy pool)
spring.datasource.hikari.initialization-fail-timeout=-1
# Timeouts curtos: no cold-start da Vercel, conexões lentas/falhas não devem
# segurar requisições por 30s (default do Hikari). A app responde rápido e,
# se o banco voltar, o pool se recupera sozinho.
spring.datasource.hikari.connection-timeout=4000
spring.datasource.hikari.validation-timeout=3000
# Limita conexões por instância (serverless: menos conexões no Supabase e menos memória)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# Limita threads do Tomcat (serverless: menos memória por instância, sem estourar o pool)
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# ── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Thymeleaf ─────────────────────────────────────────
spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ── Upload de anexos ─────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ── Logging ───────────────────────────────────────────
logging.level.com.opr.multas=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ── OPR Moderacao ─────────────────────────────────────
# Score mínimo para ser revisor
opr.moderacao.limiar-revisor=100
# Quórum de votos por caso
opr.moderacao.votos-necessarios=3
# Expiração da janela (horas)
opr.moderacao.prazo-revisao-horas=72
opr.score.caso-aprovado-solicitante=10
opr.score.caso-rejeitado-solicitante=-5
opr.score.voto-correto-revisor=5
opr.score.voto-incorreto-revisor=-3
opr.score.voto-malicioso-revisor=-15

# ── OAuth2 (Google) ───────────────────────────────────
# Defina as variáveis de ambiente GOOGLE_CLIENT_ID e GOOGLE_CLIENT_SECRET
# (ou substitua os placeholders abaixo pelos valores reais do Google Cloud Console).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:SUBSTITUA_PELO_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:SUBSTITUA_PELO_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.user-name-attribute=email
