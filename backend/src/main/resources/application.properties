# ====================================================
# OPR Multas App - Configurações
# ====================================================

# Server
# Em plataformas como a Vercel, a porta é fornecida pela variável PORT
server.port=${PORT:8080}
spring.application.name=opr-multas-app

# Sessão: em desenvolvimento (single instance) mantém a sessão em memória padrão.
# Em produção use o perfil 'prod', que sobrescreve para store-type=jdbc (sessão no
# Postgres), necessária porque o Vercel escala o container a zero entre requests e a
# sessão em memória se perde (causa logout/volta ao login ao navegar).
spring.session.store-type=none

# O cache é gerenciado pelo CacheConfig (que cria o próprio RedisConnectionFactory e
# CacheManager, usando Caffeine quando REDIS_URL está vazio). Ao excluir os
# auto-configs do Redis, evitamos beans duplicados/scan no boot (cold-start mais
# leve) e o erro 'redisConnectionFactory' em shutdown com lazy-initialization.
# Também excluímos o RabbitAutoConfiguration: a conexão Rabbit é criada pelo RabbitConfig
# somente quando app.rabbitmq.url (RABBITMQ_URL) está definida; sem isso não há beans.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# ── Fila de revisão (RabbitMQ) ─────────────────────────
# Onde fica a fila 'fila_revisao'. Quando vazio (dev/local), a fila fica inativa (sem
# beans Rabbit) e a entrega do próximo caso cai para seleção por banco (testes locais).
# Em produção defina RABBITMQ_URL (ex.: amqps://usuario:senha@host/vhost), consumido
# pelo RabbitConfig (parse da URL). Timeouts curtos são fixados na ConnectionFactory
# para nunca segurar requisição/deploy por um Rabbit indisponível.
app.rabbitmq.url=${RABBITMQ_URL:}

# ── Vencimento de multa ─────────────────────────────────────
# A data de vencimento de uma nova multa é sempre a data de criação + N dias.
app.prazo-vencimento-dias=${OPR_PRAZO_VENCIMENTO_DIAS:90}

# A Vercel termina o TLS e repassa X-Forwarded-Proto/Host. Sem isso o Tomcat vê a
# requisição como http:// e o Spring Security gera redirect_uri http:// no OAuth2
# do Google -> 400 redirect_uri_mismatch. O "framework" respeita esses headers.
server.forward-headers-strategy=framework

# Boot rápido no cold-start (Vercel): cria os beans sob demanda, então o Tomcat
# liga na porta em ~2-3s. Beans @Scheduled seguem sendo criados cedo; os jobs de
# seed/expiração resolvem os repositórios só quando executam (ObjectProvider).
spring.main.lazy-initialization=true

# Os repositórios Spring Data em DEFAULT mode são criados durante o boot e puxam
# o EntityManagerFactory junto (no Vercel: ~5s de round-trips ao Postgres, que
# estouravam a janela de port-bind). Em DEFERRED mode eles sobem numa thread de
# fundo APÓS o ApplicationReadyEvent — o Tomcat liga a porta antes de qualquer JPA.
spring.data.jpa.repositories.bootstrap-mode=deferred

# Desliga o OpenEntityManagerInViewInterceptor (e o warning): evita segurar o EMF
# no escopo de renderização e remove mais uma dependência que puxa a JPA no boot.
spring.jpa.open-in-view=false

# ── Database ──────────────────────────────────────────
# Local (dev): H2 em memória.
# Produção (Vercel/Supabase): defina as envs abaixo (NUNCA no repositório):
#   DATABASE_URL      -> postgresql://usuario:senha@host:5432/banco  (convertida para JDBC
#                        automaticamente pelo DatasourceConfig) ou jdbc:postgresql://...
#                        Se estiver ausente ou for só o host (sem esquema), o DatasourceConfig
#                        usa POSTGRES_URL / POSTGRES_URL_NON_POOLING / POSTGRES_PRISMA_URL
#                        (integração Vercel x Supabase) ou monta a JDBC a partir do host.
#   DATABASE_USER     -> opcional se a URL já tiver credenciais
#   DATABASE_PASSWORD -> opcional se a URL já tiver credenciais
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:multasdb}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# Não derruba o startup se o banco estiver indisponível (lazy pool)
spring.datasource.hikari.initialization-fail-timeout=-1
# Timeouts curtos: no cold-start da Vercel, conexões lentas/falhas não devem
# segurar requisições por 30s (default do Hikari). A app responde rápido e,
# se o banco voltar, o pool se recupera sozinho.
spring.datasource.hikari.connection-timeout=4000
spring.datasource.hikari.validation-timeout=3000
# Limita conexões por instância (serverless: menos conexões no Supabase e menos memória).
# O pooler do Supabase em session mode (pooler.supabase.com:5432) limita a 15 clientes
# simultâneos; com vários containers frios da Vercel ao mesmo tempo, 3/instância evita
# o erro FATAL: (EMAXCONNSESSION) max clients reached.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0

# Limita threads do Tomcat (serverless: menos memória por instância, sem estourar o pool)
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# ── Cache ─────────────────────────────────────────────
# Cache de consultas (dashboard de multas/fila/resolvidos/moderacao).
# Em produção use Upstash/Vercel KV definindo a env REDIS_URL (rediss://...).
# NO DEFININDO spring.data.redis.url: se ela ficar vazia o Boot falha (Invalid URL).
# O CacheConfig decide Redis x Caffeine por app.redis-url e cria o factory sozinho.
app.cache.redis-url=${REDIS_URL:}
app.cache.ttl=30s
app.cache.max-size=10000
# Timeouts curtos para nunca segurar requisições
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}
# Redis é usado apenas como cache (CacheManager via CacheConfig), não há repositórios
# Spring Data Redis. Desligar o scan de repos evita a thread "Multiple Spring Data
# modules found" no boot e corta alguns segundos do cold-start (janela de 15s da Vercel).
spring.data.redis.repositories.enabled=false

# ── JPA / Hibernate ───────────────────────────────────
# O schema é gerenciado pelo Liquibase (db/changelog/db.changelog-master.yaml),
# nunca pelo Hibernate. O Liquibase roda no boot sobre o mesmo DataSource.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ── Liquibase ──────────────────────────────────────────
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
# Não invalida checksums de changesets existentes entre runs (evita re-run acidental)
spring.liquibase.clear-checksums=false

# ── Thymeleaf ─────────────────────────────────────────
spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ── Upload de anexos ─────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ── Logging ───────────────────────────────────────────
logging.level.com.opr.multas=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ── OPR Moderacao ─────────────────────────────────────
# Score mínimo para ser revisor
opr.moderacao.limiar-revisor=100
# Quórum de votos por caso
opr.moderacao.votos-necessarios=3
# Expiração da janela (horas)
opr.moderacao.prazo-revisao-horas=72
opr.score.caso-aprovado-solicitante=10
opr.score.caso-rejeitado-solicitante=-5
opr.score.voto-correto-revisor=5
opr.score.voto-incorreto-revisor=-3
opr.score.voto-malicioso-revisor=-15

# ── OAuth2 (Google) ───────────────────────────────────
# Defina as variáveis de ambiente GOOGLE_CLIENT_ID e GOOGLE_CLIENT_SECRET
# (ou substitua os placeholders abaixo pelos valores reais do Google Cloud Console).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:SUBSTITUA_PELO_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:SUBSTITUA_PELO_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.user-name-attribute=email
